name: Release standalone binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: agentsafefs-windows-x64.exe
          - os: windows-11-arm
            asset: agentsafefs-windows-arm64.exe
          - os: ubuntu-latest
            asset: agentsafefs-linux-x64
          - os: ubuntu-24.04-arm
            asset: agentsafefs-linux-arm64
          - os: macos-15-intel
            asset: agentsafefs-macos-x64
          - os: macos-15
            asset: agentsafefs-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node 22.23.2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs
      - name: Test
        run: npm test
      - name: Build standalone binary
        run: npm run build:binary
      - name: Smoke test standalone binary
        run: ./dist/${{ matrix.asset }} doctor --root . --json
      - name: Attest native binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ matrix.asset }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node 22.23.2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs
      - name: Download native binaries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: binary-*
          path: dist/release
          merge-multiple: true
      - name: Build package archive
        run: |
          npm pack --pack-destination dist/release
          node scripts/render-release-notes.mjs > dist/release-notes.md
      - name: Export GitHub SPDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq '.sbom' > "dist/release/agentsafefs-${GITHUB_REF_NAME}-sbom.spdx.json"
      - name: Generate SHA-256 checksums
        run: |
          (cd dist/release && sha256sum *) > dist/SHA256SUMS.txt
          mv dist/SHA256SUMS.txt dist/release/SHA256SUMS.txt
      - name: Attest package metadata provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/*.tgz
            dist/release/*-sbom.spdx.json
            dist/release/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AgentSafeFS $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            --latest
