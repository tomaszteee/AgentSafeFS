name: Release standalone binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: agentsafefs-windows-x64.exe
          - os: windows-11-arm
            asset: agentsafefs-windows-arm64.exe
          - os: ubuntu-latest
            asset: agentsafefs-linux-x64
          - os: ubuntu-24.04-arm
            asset: agentsafefs-linux-arm64
          - os: macos-15-intel
            asset: agentsafefs-macos-x64
          - os: macos-15
            asset: agentsafefs-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node 22.23.2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs
      - name: Test
        run: npm test
      - name: Build standalone binary
        run: npm run build:binary
      - name: Smoke test standalone binary
        run: ./dist/${{ matrix.asset }} doctor --root . --json
      - name: Upload unsigned Windows artifact for SignPath origin verification
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1
      - name: Submit Windows artifact to SignPath Foundation signing
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
      - name: Replace unsigned Windows binary with SignPath-signed binary
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $asset = '${{ matrix.asset }}'
          $signed = Get-ChildItem -Path dist/signed -Recurse -File -Filter $asset | Select-Object -First 1
          if (-not $signed) { throw "SignPath output did not contain $asset" }
          Copy-Item -LiteralPath $signed.FullName -Destination (Join-Path dist $asset) -Force
          $signature = Get-AuthenticodeSignature -FilePath (Join-Path dist $asset)
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
          Write-Host "Signed by: $($signature.SignerCertificate.Subject)"
      - name: Attest native binary provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ matrix.asset }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node 22.23.2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs
      - name: Download native binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: binary-*
          path: dist/release
          merge-multiple: true
      - name: Build package archive
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          npm pack --pack-destination dist/release
          node scripts/render-release-notes.mjs > dist/release-notes.md
      - name: Export GitHub SPDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq '.sbom' > "dist/release/agentsafefs-${GITHUB_REF_NAME}-sbom.spdx.json"
      - name: Generate SHA-256 checksums
        run: |
          (cd dist/release && sha256sum *) > dist/SHA256SUMS.txt
          mv dist/SHA256SUMS.txt dist/release/SHA256SUMS.txt
      - name: Attest package metadata provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/*.tgz
            dist/release/*-sbom.spdx.json
            dist/release/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AgentSafeFS $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            --latest
