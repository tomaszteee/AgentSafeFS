name: Bug report
description: Report a reproducible AgentSafeFS defect or regression.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AgentSafeFS. Security vulnerabilities must be reported privately through the Security tab, not here.
  - type: input
    id: version
    attributes:
      label: AgentSafeFS version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, filesystem, and Node.js version.
      placeholder: Windows 11 / NTFS / Node.js 24
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample and filesystem setup that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
